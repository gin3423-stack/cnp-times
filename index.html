paper.addEventListener('click',event=>{if(directMode.getAttribute('aria-pressed')!=='true')return;if(event.target===photoTarget){photoQuick.click();return;}const target=event.target.closest('text[id],tspan[id]');if(target&&editableInputs.has(target.id)){event.stopPropagation();editOnPaper(target.id,target);}});


let activeTextControl=null;document.addEventListener('focusin',event=>{if(event.target.matches('input[data-id],.direct-input'))activeTextControl=event.target;});
function convertTone(text,tone){let value=text.trim();if(!value||/^[_＿\s]+$/.test(value))return value;if(tone==='reporter'){value=value.replace(/だよ(?=[。！？!?]|$)/g,'とのことです').replace(/だね(?=[。！？!?]|$)/g,'ですね').replace(/だ(?=[。！？!?]|$)/g,'です').replace(/した(?=[。！？!?]|$)/g,'しました').replace(/してる(?=[。！？!?]|$)/g,'しています').replace(/すごい/g,'大きな');if(!/速報/.test(value))value='速報です。'+value;if(!/現場からは以上/.test(value))value+=' 現場からは以上です。';}else if(tone==='samurai'){value=value.replace(/ありがとうございました/g,'かたじけない').replace(/ありがとう/g,'かたじけない').replace(/でした(?=[。！？!?]|$)/g,'であった').replace(/です(?=[。！？!?]|$)/g,'でござる').replace(/ました(?=[。！？!?]|$)/g,'もうした').replace(/ます(?=[。！？!?]|$)/g,'申す').replace(/だよ(?=[。！？!?]|$)/g,'であるぞ').replace(/だね(?=[。！？!?]|$)/g,'でござるな').replace(/すごい/g,'見事な');if(!/(でござる|であった|申す|もうした|であるぞ|でござるな)[。！？!?]?$/.test(value))value+=' でござる。';}else{value=value.replace(/です(?=[。！？!?]|$)/g,'だよぉ').replace(/ます(?=[。！？!?]|$)/g,'するよぉ').replace(/すごい/g,'こいつぁすごいねぇ');if(!/^むふふ/.test(value))value='むふふ…… '+value;if(!/おじさん、びっくり/.test(value))value+=' おじさん、びっくりだよぉ！';}return value;}
document.querySelectorAll('.tone-buttons button').forEach(button=>button.addEventListener('click',()=>{if(!activeTextControl){document.getElementById('toneStatus').textContent='先に変換したい文章を入力欄か紙面上で選んでください';return;}const before=activeTextControl.value;const after=convertTone(before,button.dataset.tone);if(after===before){document.getElementById('toneStatus').textContent='文章を入力してから変換してください';return;}activeTextControl.value=after;activeTextControl.dispatchEvent(new Event('input',{bubbles:true}));const toneNames={reporter:'記者風',samurai:'武将風',eccentric:'変態おじさん風'};document.getElementById('toneStatus').textContent=toneNames[button.dataset.tone]+'に変換しました。必要に応じて手直ししてください。';}));
</script></body></html>
